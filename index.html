<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0871c9"><title>Projekt Bau – Kunden & Projekte</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="customer-detail.css"></head><body>
<header class="topbar"><nav aria-label="Hauptnavigation"><button class="nav active" data-view="customers">▣&nbsp; Kunden</button><button class="nav" data-view="projects">▤&nbsp; Projekte</button></nav><div class="user">Grüezi Vakkas <span>⏻</span></div></header>
<main>
<section id="customersView" class="view customer-shell"><div class="customer-title"><h1>▣ <span>Kunden</span></h1><div class="round-actions"><button id="customerHelp" title="Hilfe">?</button><button id="customerExport" title="Excel exportieren">⇩</button><button id="newCustomer" title="Neuer Kunde">＋</button></div></div><div class="table-scroll"><table><thead><tr id="customerHeaders"></tr><tr id="customerFilters"></tr></thead><tbody id="customerList"></tbody></table></div><div class="pagination"><button id="firstPage">≪</button><button id="prevPage">‹</button><select id="pageSize"><option>15</option><option>25</option><option>50</option></select><button id="nextPage">›</button></div></section>
<section id="customerEditorView" class="view hidden customer-editor"><form id="customerPageForm"><section class="detail-card"><div class="detail-title"><h1>▣ <span>Kunde</span></h1><button type="button" id="customerFormHelp" class="circle">?</button></div><div class="customer-form-grid"><label>Typ<select name="type"><option value=""></option><option>Privatkunde</option><option>Firma</option><option>Verwaltung</option></select></label><label>Kundennummer<div class="input-action"><span>▣</span><input name="number" readonly><button type="submit" title="Kunde speichern">✎</button></div></label><label>Anrede<select name="salutation"><option value=""></option><option>Herr</option><option>Frau</option><option>Familie</option><option>Firma</option></select></label><label>Briefanrede<input name="letterSalutation"></label><label>Vorname<div class="input-action"><span>ⅰ</span><input name="firstName"></div></label><label>Nachname<div class="input-action"><span>ⅰ</span><input name="lastName"></div></label><label>Email<div class="input-action"><span>✉</span><input name="email" type="email"><button type="button" data-contact="email">✉</button></div></label><label>Fax<div class="input-action"><span>▤</span><input name="fax"></div></label><label>Telefon<div class="input-action"><span>⌕</span><input name="phone" type="tel"><button type="button" data-contact="phone">⌕</button></div></label><label>Mobil<div class="input-action"><span>⌕</span><input name="mobile" type="tel"><button type="button" data-contact="mobile">⌕</button></div></label></div></section><section class="history-card"><h2>◷ <span>Verlauf</span></h2><div id="customerHistory" class="history-list"></div></section><div class="page-actions"><button type="button" id="backCustomers">← Zurück</button><button type="button" id="deleteCustomer" class="danger">Löschen</button><button type="submit" class="primary">Speichern</button></div></form></section>
<section id="projectsView" class="view hidden"><div class="toolbar"><h1>Projekte</h1><div><input id="search" type="search" placeholder="Projekte suchen …"><button class="primary" id="newProject">+ Neues Projekt</button></div></div><div id="projectList" class="grid"></div></section>
</main><dialog id="editor"><form method="dialog" id="editorForm"><div class="dialog-head"><h2 id="editorTitle"></h2><button value="cancel" class="icon" aria-label="Schliessen">×</button></div><div id="editorFields" class="form-grid"></div><div class="dialog-actions"><button value="cancel">Abbrechen</button><button type="button" id="deleteItem" class="danger hidden">Löschen</button><button type="submit" value="save" class="primary">Speichern</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
