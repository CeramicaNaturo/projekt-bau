<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d37"><title>Projekt Bau – Kunden & Projekte</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><nav aria-label="Hauptnavigation"><button class="nav active" data-view="customers">▣&nbsp; Kunden</button><button class="nav" data-view="projects">▤&nbsp; Projekte</button></nav><div class="user">Grüezi Vakkas <span>⏻</span></div></header>
