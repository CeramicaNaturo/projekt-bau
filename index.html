<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0871c9"><title>Projekt Bau – Kunden & Projekte</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="customer-detail.css"><link rel="stylesheet" href="customer-sections.css"><link rel="stylesheet" href="customer-forms-v2.css"></head><body>
<header class="topbar"><nav aria-label="Hauptnavigation"><button class="nav active" data-view="customers">▣&nbsp; Kunden</button><button class="nav" data-view="projects">▤&nbsp; Projekte</button></nav><div class="user">Grüezi Vakkas <span>⏻</span></div></header>
<main>
<section id="customersView" class="view customer-shell"><div class="customer-title"><h1>▣ <span>Kunden</span></h1><div class="round-actions"><button id="customerHelp" title="Hilfe">?</button><button id="customerExport" title="Excel exportieren">⇩</button><button id="newCustomer" title="Neuer Kunde">＋</button></div></div><div class="table-scroll"><table><thead><tr id="customerHeaders"></tr><tr id="customerFilters"></tr></thead><tbody id="customerList"></tbody></table></div><div class="pagination"><button id="firstPage">≪</button><button id="prevPage">‹</button><select id="pageSize"><option>15</option><option>25</option><option>50</option></select><button id="nextPage">›</button></div></section>
<section id="customerEditorView" class="view hidden customer-editor"><form id="customerPageForm"><section class="detail-card"><div class="detail-title"><h1>▣ <span>Kunde</span></h1><button type="button" id="customerFormHelp" class="circle">?</button></div><div class="customer-form-grid"><label>Typ<select name="type"><option value=""></option><option>Privat</option><option>Firma</option><option>Verwaltung</option></select></label><label>Kundennummer<div class="input-action"><span>▣</span><input name="number" readonly><button type="submit">✎</button></div></label><label class="company-only hidden">Name<div class="input-action"><span>▣</span><input name="company"></div></label><label class="company-only hidden">Mehrwertsteuernummer<div class="input-action"><span>▣</span><input name="vatNumber"><button type="button" id="vatHelp">?</button></div></label><label>Anrede<select name="salutation"><option value=""></option><option>Herr</option><option>Frau</option><option>Familie</option><option>Firma</option></select></label><label>Briefanrede<input name="letterSalutation"></label><label>Vorname<div class="input-action"><span>ⅰ</span><input name="firstName"></div></label><label>Nachname<div class="input-action"><span>ⅰ</span><input name="lastName"></div></label><label>Email<div class="input-action"><span>✉</span><input name="email" type="email"><button type="button" data-contact="email">✉</button></div></label><label>Fax<div class="input-action"><span>▤</span><input name="fax"></div></label><label>Telefon<div class="input-action"><span>⌕</span><input name="phone"><button type="button" data-contact="phone">⌕</button></div></label><label>Mobil<div class="input-action"><span>⌕</span><input name="mobile"><button type="button" data-contact="mobile">⌕</button></div></label></div></section>
<section class="customer-tabs-card"><div class="customer-tabs"><button type="button" class="active" data-customer-tab="addresses">▧ Adressen</button><button type="button" data-customer-tab="contacts">♙ Ansprechpartner</button><button type="button" data-customer-tab="bank">♜ Zahlung &amp; Bank</button><button type="button" data-customer-tab="notes">▱ Anmerkung</button></div>
<div class="tab-pane" data-tab-pane="addresses"><div class="tab-top"><select><option>Neue Adresse</option></select><button type="button" class="circle">＋</button></div><div class="address-grid"><label>Bezeichnung<input name="addressLabel"></label><label>Typ<select name="addressType"><option>Standard</option><option>Rechnungsadresse</option><option>Objektadresse</option><option>Lieferadresse</option></select></label><label class="wide">abweichender Empfänger<input name="addressRecipient"></label><label>Vorname<input name="addressFirstName"></label><label>Nachname<input name="addressLastName"></label><label>Telefon<input name="addressPhone"></label><label>Email<input name="addressEmail"></label><label class="wide">Adressergänzung<input name="addressExtra"></label><label class="street-field">Strasse<input name="street" autocomplete="off"><div id="addressSuggestions" class="address-suggestions hidden"></div></label><label>Hausnummer<input name="houseNumber"></label><label>PLZ<input name="zip"></label><label>Stadt<input name="city"></label></div></div>
<div class="tab-pane hidden" data-tab-pane="contacts"><div class="tab-top"><select id="contactSelection"><option value="">Neuer Ansprechpartner</option></select><div><button type="button" class="circle" id="newContact">＋</button><button type="button" class="circle red" id="deleteContact">▥</button></div></div><div class="address-grid"><label>Anrede<select name="contactSalutation"><option value=""></option><option>Herr</option><option>Frau</option></select></label><label>Briefanrede<input name="contactLetterSalutation"></label><label>Titel<input name="contactTitle"></label><span></span><label>Vorname<input name="contactFirstName"></label><label>Nachname<input name="contactLastName"></label><label>Geburtsdatum<input name="contactBirthday" type="date"></label><label>Rolle<input name="contactRole"></label><label>Email<input name="contactEmail" type="email"></label><label>Fax<input name="contactFax"></label><label>Telefon<input name="contactPhone"></label><label>Mobil<input name="contactMobile"></label><label>Telefon privat<input name="contactPrivatePhone"></label><span></span><label class="wide">Anmerkung<textarea name="contactNotes" rows="5"></textarea></label></div></div>
<div class="tab-pane hidden" data-tab-pane="bank"><div class="address-grid"><label>Kontoinhaber<input name="accountHolder"></label><label>Bank Name<input name="bankName"></label><label>IBAN<input name="iban"></label><label>BIC<input name="bic"></label></div><h3 class="payment-title">Zahlungsbedingungen</h3><div class="payment-box"><label>Zahlungsziel (in Tagen)<input name="paymentTerm" type="number" min="0" inputmode="numeric"></label><label class="check"><input name="discountEnabled" type="checkbox"> Skonto</label><label class="check"><input name="reverseCharge" type="checkbox"> Steuerschuldumkehr (reverse charge)</label><small>Dieses Zahlungsziel wird später als Kundenreferenz für Offerten und Rechnungen verwendet.</small></div></div>
<div class="tab-pane hidden" data-tab-pane="notes"><label class="note-field">Anmerkung<textarea name="notes" rows="8"></textarea></label><div class="address-grid notes-meta"><label>Akquisekanal<div class="acquisition-row"><input name="acquisitionChannel" list="acquisitionChannels"><button type="button" class="circle" id="addAcquisitionChannel">＋</button></div><datalist id="acquisitionChannels"></datalist></label><label>Sprache<select name="language"><option>deutsch (Schweiz)</option><option>français (Suisse)</option><option>italiano (Svizzera)</option><option>English</option></select></label></div></div></section>
<section class="documents-card"><h2>▱ <span>Dokumente</span></h2><div class="document-search"><label>Suche<input id="documentSearch" placeholder="Suche"></label><label>von<input type="date"></label><label>bis<input type="date"></label></div><div class="document-tabs" id="documentTabs"><button type="button" class="active">⚯ Projekte</button><button type="button">▦ Termine</button><button type="button">⌑ Aufmaß</button><button type="button">▤ Offerten</button><button type="button">▣ Regieberichte</button><button type="button">↝ Aufträge</button><button type="button">▱ Lieferscheine</button><button type="button">⌂ Abnahmeprotokolle</button><button type="button">▤ Rechnungen</button><button type="button">▣ Zahlungen</button><button type="button">♧ Mahnungen</button><button type="button">▥ Formulare</button><button type="button">▱ Verträge</button><button type="button">✉ gesendete Emails</button><button type="button">✉ Briefe</button></div><div class="document-body"><div id="customerDocuments"></div><button type="button" class="circle" id="addDocument">＋</button></div></section>
<section class="files-card"><div class="files-title"><h2>▱ <span>Dateien</span></h2><div><input id="fileSearch"><button type="button" class="circle">▰</button><button type="button" class="circle" id="selectFiles">＋</button></div></div><a class="folder">▭ Start</a><div class="dropzone" id="fileDropzone">zum Hochladen Datei droppen oder klicken<input type="file" id="customerFiles" multiple hidden></div><div id="fileList"></div></section>
<section class="history-card"><h2>◷ <span>Verlauf</span></h2><div id="customerHistory" class="history-list"></div></section><div class="page-actions"><button type="button" id="backCustomers">← Zurück</button><button type="button" id="deleteCustomer" class="danger">Löschen</button><button type="submit" class="primary">Speichern</button></div></form></section>
<section id="projectsView" class="view hidden"><div class="toolbar"><h1>Projekte</h1><div><input id="search" type="search" placeholder="Projekte suchen …"><button class="primary" id="newProject">+ Neues Projekt</button></div></div><div id="projectList" class="grid"></div></section>
</main><dialog id="editor"><form method="dialog" id="editorForm"><div class="dialog-head"><h2 id="editorTitle"></h2><button value="cancel" class="icon" aria-label="Schliessen">×</button></div><div id="editorFields" class="form-grid"></div><div class="dialog-actions"><button value="cancel">Abbrechen</button><button type="button" id="deleteItem" class="danger hidden">Löschen</button><button type="submit" value="save" class="primary">Speichern</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
