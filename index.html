<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Projekt Bau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">BAUPROJE-DOKUMENTATION · v0.6.1</div>
    <h1>Projekt Bau</h1>
  </div>
  <button id="workerView" class="secondary">Mitarbeiteransicht</button>
</header>

<main class="wrap">
<section class="card editor">
  <div class="title"><h2>Neues Projekt</h2><span class="pill">PDF-Bericht · Foto & Galerie</span></div>
  <div class="grid">
    <label>Projektname<input id="name" placeholder="z. B. Müller Wohnung"></label>
    <label>Adresse<input id="address" placeholder="z. B. Zürich"></label>
    <label>Kunde / Firma<input id="customer"></label>
    <label>Telefon<input id="phone"></label>
    <label>Startdatum<input id="startDate" type="date"></label>
    <label>Verantwortlich<input id="owner"></label>
  </div>
  <label>Allgemeine Beschreibung<textarea id="description" rows="3"></textarea></label>
  <button id="create" class="primary">Projekt erstellen</button>
</section>

<section class="card editor">
  <div class="title">
    <h2>Projekte</h2>
    <div class="actions">
      <button id="backup" class="secondary">Sicherung erstellen</button>
      <label class="secondary file">Sicherung öffnen<input id="restore" type="file" accept=".json"></label>
    </div>
  </div>
  <div id="projects"></div>
</section>

<section id="panel" class="card hidden">
  <div class="title">
    <div>
      <div class="eyebrow">AKTIVES PROJEKT</div>
      <h2 id="pTitle"></h2>
      <div id="pMeta" class="muted"></div>
    </div>
    <div class="actions editor">
      <button id="printReport" class="primary">PDF-Bericht erstellen</button>
      <button id="deleteProject" class="danger">Projekt löschen</button>
    </div>
  </div>

  <div id="summary" class="summary"></div>
  <hr>

  <div class="editor">
    <div class="grid compact">
      <label>Bereich<input id="areaName" placeholder="Bad / Küche / Wohnzimmer"></label>
      <label>Priorität
        <select id="priority"><option>Normal</option><option>Wichtig</option><option>Dringend</option></select>
      </label>
    </div>
    <button id="addArea" class="primary">Bereich Ekle</button>
  </div>

  <div id="areas"></div>
</section>

<section class="card editor">
  <div class="title"><h2>OneDrive</h2><span class="pill warn">nächster Schritt</span></div>
  <p class="muted">Önce saha ve PDF yapısını tamamlıyoruz. OneDrive senkronizasyonu nächster Schrittda eklenecek.</p>
</section>
</main>

<div id="printReportRoot" class="print-report"></div>

<script src="app.js"></script>
</body>
</html>
