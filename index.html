<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Projekt Bau</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>SAHA PROJE TAKİBİ · v0.2</small><h1>Projekt Bau</h1></div><button id="workerView" class="secondary">İşçi Görünümü</button></header><main>
<section class="card editor"><h2>Yeni Proje</h2><div class="grid"><label>Proje adı<input id="name"></label><label>Adres<input id="address"></label><label>Müşteri / Firma<input id="customer"></label><label>Telefon<input id="phone"></label><label>Başlangıç tarihi<input id="startDate" type="date"></label><label>Sorumlu<input id="owner"></label></div><label>Genel açıklama<textarea id="description"></textarea></label><button id="create" class="primary">Projeyi Oluştur</button></section>
<section class="card editor"><div class="title"><h2>Projeler</h2><div><button id="backup" class="secondary">Yedek Al</button><label class="secondary file">Yedeği Aç<input id="restore" type="file" accept=".json"></label></div></div><div id="projects"></div></section>
<section id="panel" class="card hidden"><div class="title"><div><small>AKTİF PROJE</small><h2 id="pTitle"></h2><div id="pMeta" class="muted"></div></div><div class="editor"><button id="print" class="secondary">PDF / Yazdır</button><button id="deleteProject" class="danger">Projeyi Sil</button></div></div><div id="summary" class="summary"></div><hr><div class="editor"><div class="grid"><label>Bölüm<input id="areaName"></label><label>Öncelik<select id="priority"><option>Normal</option><option>Wichtig</option><option>Dringend</option></select></label></div><button id="addArea" class="primary">Bölüm Ekle</button></div><div id="areas"></div></section>
<section class="card editor"><h2>OneDrive</h2><p class="muted">Bu sürümde saha kullanımını geliştiriyoruz. OneDrive senkronizasyonu sonraki adımda eklenecek.</p></section></main><script src="app.js"></script></body></html>
