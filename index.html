<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Projekt Bau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">SAHA PROJE TAKİBİ · v0.3</div>
    <h1>Projekt Bau</h1>
  </div>
  <button id="workerView" class="secondary">İşçi Görünümü</button>
</header>

<main class="wrap">
<section class="card editor">
  <div class="title"><h2>Yeni Proje</h2><span class="pill">PDF geliştirilmiş</span></div>
  <div class="grid">
    <label>Proje adı<input id="name" placeholder="Örn. Müller Wohnung"></label>
    <label>Adres<input id="address" placeholder="Örn. Zürich"></label>
    <label>Müşteri / Firma<input id="customer"></label>
    <label>Telefon<input id="phone"></label>
    <label>Başlangıç tarihi<input id="startDate" type="date"></label>
    <label>Sorumlu<input id="owner"></label>
  </div>
  <label>Genel açıklama<textarea id="description" rows="3"></textarea></label>
  <button id="create" class="primary">Projeyi Oluştur</button>
</section>

<section class="card editor">
  <div class="title">
    <h2>Projeler</h2>
    <div class="actions">
      <button id="backup" class="secondary">Yedek Al</button>
      <label class="secondary file">Yedeği Aç<input id="restore" type="file" accept=".json"></label>
    </div>
  </div>
  <div id="projects"></div>
</section>

<section id="panel" class="card hidden">
  <div class="title">
    <div>
      <div class="eyebrow">AKTİF PROJE</div>
      <h2 id="pTitle"></h2>
      <div id="pMeta" class="muted"></div>
    </div>
    <div class="actions editor">
      <button id="printReport" class="primary">PDF Raporu Oluştur</button>
      <button id="deleteProject" class="danger">Projeyi Sil</button>
    </div>
  </div>

  <div id="summary" class="summary"></div>
  <hr>

  <div class="editor">
    <div class="grid compact">
      <label>Bölüm<input id="areaName" placeholder="Bad / Küche / Salon"></label>
      <label>Öncelik
        <select id="priority"><option>Normal</option><option>Wichtig</option><option>Dringend</option></select>
      </label>
    </div>
    <button id="addArea" class="primary">Bölüm Ekle</button>
  </div>

  <div id="areas"></div>
</section>

<section class="card editor">
  <div class="title"><h2>OneDrive</h2><span class="pill warn">sonraki aşama</span></div>
  <p class="muted">Önce saha ve PDF yapısını tamamlıyoruz. OneDrive senkronizasyonu sonraki aşamada eklenecek.</p>
</section>
</main>

<div id="printReportRoot" class="print-report"></div>

<script src="app.js"></script>
</body>
</html>
