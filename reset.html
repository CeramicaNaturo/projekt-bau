<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt Bau – Update v2.8.0 PRO</title>
</head>
<body style="font-family:Segoe UI,Arial;padding:32px">
<h2>Projekt Bau wird auf v2.8.0 PRO aktualisiert…</h2>
<p style="color:#166534;font-weight:700">Projekt- und Grundrissdaten bleiben erhalten.</p><p id="m">Cache und Service Worker werden vollständig gelöscht.</p>
<script>
(async()=>{
  const msg=document.getElementById('m');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){ try{ await reg.unregister(); }catch(_){} }
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){ try{ await caches.delete(key); }catch(_){} }
    }
    if(msg)msg.textContent='Version 2.8.0 PRO wird jetzt geladen…';
  }catch(e){
    if(msg)msg.textContent='Cache-Aktualisierung abgeschlossen.';
  }
  const u=new URL('index.html',location.href);
  u.searchParams.set('v','2790');
  u.searchParams.set('nocache',String(Date.now()));
  location.replace(u.toString());
})();
</script>
</body>
</html>
