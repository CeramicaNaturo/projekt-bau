<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projekt Bau – Update</title></head>
<body style="font-family:Segoe UI,Arial;padding:32px"><h2>Projekt Bau wird auf v1.5 aktualisiert…</h2><p id="m">Bitte einen Moment warten.</p>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
  document.getElementById('m').textContent='Cache gelöscht. v1.5 wird geöffnet…';
  setTimeout(()=>location.replace('./index.html?v=150&t='+Date.now()),700);
 }catch(e){
  document.getElementById('m').textContent='Bitte Edge vollständig schliessen und erneut öffnen.';
 }
})();
</script></body></html>
