<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt Bau – Update v1.8.6</title>
</head>
<body style="font-family:Segoe UI,Arial;padding:32px">
<h2>Projekt Bau wird auf v1.8.6 aktualisiert…</h2>
<p id="m">Cache und Service Worker werden vollständig gelöscht.</p>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    sessionStorage.clear();
    document.getElementById('m').textContent='Fertig. Version 1.6.9 wird jetzt geladen…';
    setTimeout(()=>{
      location.replace('./index.html?v=186&nocache='+Date.now());
    },900);
  }catch(e){
    document.getElementById('m').textContent='Bitte Edge vollständig schliessen und danach diese Seite erneut öffnen.';
  }
})();
</script>
</body>
</html>
