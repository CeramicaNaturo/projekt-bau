<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt Bau – Update v2.8.5 PRO</title>
<style>
body{font-family:Arial,sans-serif;padding:30px;background:#f8fafc;color:#0f172a}
.card{max-width:620px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;border:1px solid #dbe3ee}
</style>
</head>
<body>
<div class="card">
<h2>Projekt Bau v2.8.5 PRO wird geladen…</h2>
<p>Projekt- und Grundrissdaten bleiben erhalten.</p>
<p id="m">Service Worker und Cache werden aktualisiert.</p>
</div>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister()}catch(_){}}
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){try{await caches.delete(k)}catch(_){}}
    }
    m.textContent='Cache gelöscht. v2.8.5 PRO wird geöffnet…';
  }catch(e){}
  setTimeout(()=>location.replace('index.html?v=2850&nocache='+Date.now()),300);
})();
</script>
</body>
</html>
