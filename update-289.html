<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt Bau – Update v2.8.9 PRO</title>
<style>
body{font-family:Arial,sans-serif;padding:30px;background:#f8fafc;color:#0f172a}
.card{max-width:680px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;border:1px solid #dbe3ee}
.ok{color:#166534}
</style>
</head>
<body>
<div class="card">
<h2>Projekt Bau v2.8.9 PRO</h2>
<p class="ok"><strong>Projekt- und OneDrive-Daten werden nicht gelöscht.</strong></p>
<p id="m">Nur Service Worker und Cache werden aktualisiert. Danach migriert Projekt Bau alte Projektdaten automatisch nach IndexedDB.</p>
</div>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister()}catch(_){}}
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){try{await caches.delete(k)}catch(_){}}
    }
    m.textContent='Cache aktualisiert. IndexedDB-Migration wird gestartet…';
  }catch(e){}
  setTimeout(()=>location.replace('index.html?v=2890&nocache='+Date.now()),400);
})();
</script>
</body>
</html>
