<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt Bau – Update v2.9.1 PRO</title>
<style>
body{font-family:Arial,sans-serif;padding:28px;background:#f8fafc;color:#0f172a}
.card{max-width:720px;margin:40px auto;background:#fff;padding:28px;border-radius:14px;border:1px solid #dbe3ee}
.ok{color:#166534;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h2>Projekt Bau v2.9.1 PRO – Hard Fix</h2>
<p class="ok">Projekte, IndexedDB und OneDrive-Einstellungen werden nicht gelöscht.</p>
<p id="m">Alte Service Worker und Cache-Dateien werden entfernt…</p>
</div>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister()}catch(_){}}
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){
        if(String(k).startsWith('projekt-bau-')){
          try{await caches.delete(k)}catch(_){}
        }
      }
    }
    m.textContent='Cache bereinigt. v2.9.1 PRO wird geladen…';
  }catch(e){
    m.textContent='Update wird trotzdem fortgesetzt…';
  }
  setTimeout(()=>{
    location.replace('index.html?v=29101&hardfix='+Date.now());
  },500);
})();
</script>
</body>
</html>
